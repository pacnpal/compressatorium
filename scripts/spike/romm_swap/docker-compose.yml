# RomM for the swap spike (#382), after RomM's own examples/docker-compose.example.yml.
# Pinned to RomM 5.4.1 and MariaDB 11.8 by digest. spike.py writes the .env this
# reads (SPIKE_WORK, SPIKE_PORT, passwords, ROM_CONVERTO_ENABLED) and runs it
# under the project name romm-swap-spike. Everything lives in SPIKE_WORK or in
# this project's named volumes; `docker compose down -v` removes all of it.
# No metadata provider is configured: no keys, Hasheous off.

name: romm-swap-spike

volumes:
  mysql_data:
  romm_resources:
  romm_redis_data:

services:
  romm:
    image: rommapp/romm:5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
    restart: "no"
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=${SPIKE_DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${SPIKE_AUTH_SECRET}
      - HASHEOUS_API_ENABLED=false
      - ROM_CONVERTO_ENABLED=${ROM_CONVERTO_ENABLED:-false}
      - SCAN_WORKERS=2
      - WEB_SERVER_CONCURRENCY=2
    volumes:
      - romm_resources:/romm/resources
      - romm_redis_data:/redis-data
      - ${SPIKE_WORK}/library:/romm/library
      - ${SPIKE_WORK}/assets:/romm/assets
      - ${SPIKE_WORK}/config:/romm/config
    ports:
      - 127.0.0.1:${SPIKE_PORT:-18980}:8080
    depends_on:
      romm-db:
        condition: service_healthy

  romm-db:
    image: mariadb:11.8@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
    restart: "no"
    environment:
      - MARIADB_ROOT_PASSWORD=${SPIKE_DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=${SPIKE_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 5s
      interval: 10s
      timeout: 5s
      retries: 10
