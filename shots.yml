# === PR 3: Libraries ===
# --- One Library page (#541) -----------------------------------------------
# The fixture's "ROM Library/roms" folder is registered as a Library through
# the API (a 409 on a later shot means it already is) and its page opened.
# One script for every shot of it: the shot's name (from `?s=`) says which
# surface to stage, and the theme comes from the `-light` / `-dark` suffix.
# The Game list app shot comes last, so the others show it as None, as a new
# Library has it.
- url: http://127.0.0.1:8099/?s=libraries-light#/files
  output: docs/screenshots/libraries-light.png
  width: 1280
  height: 760
  wait: 1800
  javascript: &js_folder_library |
    (async () => {
      const shot = location.search.replace(/^\?s=/, '').replace(/-(light|dark)$/, '');
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      const send = (url, method, body) => fetch(url, {
        method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const waitFor = async (find, what) => {
        for (let i = 0; i < 60; i++) {
          const found = find();
          if (found) return found;
          await sleep(100);
        }
        throw new Error(what + ' not shown');
      };
      const volumes = await (await fetch('/api/volumes')).json();
      const volume = volumes.find(v => v.name === 'ROM Library');
      if (!volume) throw new Error('ROM Library volume not found');
      await send('/api/libraries', 'POST', { path: volume.path + '/roms' });
      const libs = await (await fetch('/api/libraries')).json();
      const lib = libs.find(l => l.kind === 'folder');
      if (!lib) throw new Error('folder Library not registered');
      const id = encodeURIComponent(lib.id);
      const automation = `#/libraries/${id}/automation`;
      if (shot === 'libraries') {
        location.hash = '#/libraries';
        await waitFor(() => document.querySelector('.card .facts span:not(.muted)'), 'card facts');
      } else if (shot === 'library-add') {
        location.hash = '#/libraries';
        const add = await waitFor(() => [...document.querySelectorAll('button')]
          .find(b => b.textContent.trim() === 'Add a Library'), 'Add a Library');
        add.click();
        const drive = await waitFor(() => [...document.querySelectorAll('.folder-picker button')]
          .find(b => b.textContent.includes('ROM Library')), 'the ROM Library drive');
        drive.click();
        await waitFor(() => [...document.querySelectorAll('.folder-picker button')]
          .find(b => b.textContent.trim() === 'roms'), 'the roms folder');
      } else if (shot === 'library-browse') {
        location.hash = `#/libraries/${id}`;
        await waitFor(() => document.querySelector('table.consoles tbody tr'), 'console table');
      } else if (shot === 'library-automation') {
        // From no console set, so both shots of the pair show the button.
        await send(`/api/libraries/${id}/rules`, 'PUT', { rules: {}, check_rules: {} });
        location.hash = automation;
        const apply = await waitFor(() => [...document.querySelectorAll('button')]
          .find(b => b.textContent.trim() === 'Apply recommended'), 'Apply recommended');
        apply.click();
        // The answer toasts either way: consoles set up, or (with no converter
        // installed, as in the screenshot run) why none could be.
        await waitFor(() => document.querySelector('[data-sonner-toast]'), 'the Apply recommended answer');
        await sleep(400);
      } else if (shot === 'library-automation-advanced') {
        await send(`/api/libraries/${id}/rules`, 'PUT', {
          rules: { ps2: { mode: 'createdvd', enabled: true, verify_after: true } },
          check_rules: { ps2: {
            enabled: true, check_budget_gb: 50,
            window_start: '01:00', window_end: '05:00', days: [0, 1, 2, 3, 4, 5, 6],
          } },
        });
        location.hash = automation;
        // By console id, not label: the row shows "PlayStation 2".
        const more = await waitFor(() => document.querySelector(
          '[data-platform-id="ps2"] button[aria-label^="More settings"]'), 'the ps2 row');
        more.click();
        const form = await waitFor(() => document.querySelector('.advanced'), 'the ps2 settings');
        form.scrollIntoView({ block: 'start' });
        await sleep(300);
      } else if (shot === 'library-watch-folders') {
        const saved = await send(`/api/libraries/${id}/inboxes`, 'POST',
          { folder: volume.path + '/downloads', settle_seconds: 60 });
        if (!saved.ok && saved.status !== 409) throw new Error('could not save the watch folder');
        // A 409 is only fine when it is this Library's downloads watch folder
        // already: a folder taken by anything else must fail the shot, not
        // capture it. The full canonical path, resolved as the backend
        // resolves it: downloads sits beside roms, and the Library's root is
        // roms resolved, so the saved folder is exactly this.
        const folder = lib.root.replace(/\/roms$/, '') + '/downloads';
        if (!lib.root.endsWith('/roms')) throw new Error('unexpected Library root ' + lib.root);
        const listed = await (await fetch(`/api/libraries/${id}/inboxes`)).json();
        const ours = f => f === folder;
        if (!(listed.inboxes || []).some(b => ours(b.folder))) {
          throw new Error('the downloads watch folder is not this Library\'s');
        }
        location.hash = automation;
        // Wait for that watch folder's status row, not a fixed delay.
        let panel = null;
        for (let i = 0; i < 50; i++) {
          panel = document.querySelector('.watch');
          const row = panel && [...panel.querySelectorAll('.rows li')]
            .find(li => ours(li.dataset?.folder));
          if (row && row.querySelector('.status')) break;
          panel = null;
          await sleep(100);
        }
        if (!panel) throw new Error('the downloads watch folder status row not shown');
        panel.scrollIntoView({ block: 'center' });
        await sleep(300);
      } else if (shot === 'library-arr') {
        // Only the dry-run check runs: nothing is taken in (CodeRabbit PR #526).
        await send('/api/hooks/arr/rewrites', 'PUT', { rewrites: [] });
        location.hash = automation;
        const fold = await waitFor(() => document.querySelector('details.arr-fold'), 'the *arr fold');
        fold.open = true;
        const card = await waitFor(() => fold.querySelector('section.arr form.row input'), 'the *arr card');
        card.value = '/downloads/ps2/shadow-colossus.iso';
        card.dispatchEvent(new Event('input', { bubbles: true }));
        // The Test button enables once the typed path renders.
        await sleep(100);
        fold.querySelector('section.arr form.row button[type="submit"]').click();
        await waitFor(() => fold.querySelector('.result'), 'the tested path');
        fold.scrollIntoView({ block: 'start' });
        await sleep(300);
      } else if (shot === 'library-placement') {
        const saved = await send(`/api/libraries/${id}`, 'PATCH', { layout: 'esde' });
        if (!saved.ok) throw new Error('could not set the folder style');
        location.hash = automation;
        const fold = await waitFor(() => document.querySelector('details.placement'), 'where new games go');
        fold.open = true;
        await waitFor(() => fold.querySelector('.rows li'), 'the placement rows');
        fold.scrollIntoView({ block: 'center' });
        await sleep(300);
      } else if (shot === 'library-frontend') {
        const saved = await send(`/api/libraries/${id}`, 'PATCH', { es_frontend: true });
        if (!saved.ok) throw new Error('could not turn the game list app on');
        location.hash = automation;
        const app = await waitFor(() => document.querySelector('.frontend'), 'the game list app');
        app.scrollIntoView({ block: 'center' });
        await sleep(300);
      } else {
        throw new Error('no staging for ' + shot);
      }
    })()
