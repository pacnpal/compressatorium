# --- Inboxes on a Library (#431) --------------------------------------------
# The same Library, with the fixture's "ROM Library/downloads" folder saved as
# its Inbox (a 409 on the second shot means it already is), and the Inboxes
# panel scrolled into view: the folder, its settle time and its status.
- url: http://127.0.0.1:8099/?s=rules-inboxes-light#/workspace/chdman
  output: docs/screenshots/rules-inboxes-light.png
  width: 1280
  height: 760
  wait: 1800
  javascript: &js_rules_inboxes |
    (async () => {
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const volumes = await (await fetch('/api/volumes')).json();
      const volume = volumes.find(v => v.name === 'ROM Library');
      if (!volume) throw new Error('ROM Library volume not found');
      await fetch('/api/libraries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: volume.path + '/roms' }),
      });
      const libs = await (await fetch('/api/libraries')).json();
      const lib = libs.find(l => l.kind === 'folder');
      if (!lib) throw new Error('folder Library not registered');
      const id = encodeURIComponent(lib.id);
      const saved = await fetch(`/api/libraries/${id}/inboxes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder: volume.path + '/downloads', settle_seconds: 60 }),
      });
      if (!saved.ok && saved.status !== 409) throw new Error('could not save the Inbox');
      // A 409 is only fine when it is this Library's downloads Inbox already:
      // a folder taken by anything else must fail the shot, not capture it.
      // The full canonical path, resolved as the backend resolves it: the
      // fixture's downloads folder sits beside roms, and the Library's root
      // is roms resolved, so the Inbox's saved folder is exactly this.
      const folder = lib.root.replace(/\/roms$/, '') + '/downloads';
      if (!lib.root.endsWith('/roms')) throw new Error('unexpected Library root ' + lib.root);
      const listed = await (await fetch(`/api/libraries/${id}/inboxes`)).json();
      const ours = f => f === folder;
      if (!(listed.inboxes || []).some(b => ours(b.folder))) {
        throw new Error('the downloads Inbox is not this Library\'s');
      }
      location.hash = `#/rules/${id}`;
      // Wait for that Inbox's status row, not a fixed delay.
      let panel = null;
      for (let i = 0; i < 50; i++) {
        panel = document.querySelector('.inboxes');
        const row = panel && [...panel.querySelectorAll('.rows li')]
          .find(li => ours(li.querySelector('.where code')?.textContent));
        if (row && row.querySelector('.status')) break;
        panel = null;
        await new Promise(r => setTimeout(r, 100));
      }
      if (!panel) throw new Error('the downloads Inbox status row not shown');
      panel.scrollIntoView({ block: 'center' });
      await new Promise(r => setTimeout(r, 300));
    })()
