# --- Delete-on-verify confirmation with the RomM swap (#391) ----------------
# A single-file disc on the GameCube volume, delete-on-verify ticked. The
# fixture has no RomM, so the plan's answer gets the change the RomM swap
# would add ("RomM: rename ROM 1234 to mario-kart.chd"), canned in the page as
# the RomM shots below do. The theme comes from `?s=`.
- url: http://127.0.0.1:8099/?s=delete-plan-romm-light#/workspace/chdman
  output: docs/screenshots/delete-plan-romm-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: &js_delete_plan_romm |
    (async () => {
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const real = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const response = await real(input, init);
        const url = new URL(typeof input === 'string' ? input : input.url, location.href);
        if (url.pathname !== '/api/jobs/delete-plan' || !response.ok) return response;
        const plan = await response.json();
        for (const item of plan.items ?? []) {
          const name = (item.source_path ?? '').split('/').pop();
          if (!name) throw new Error('delete plan item has no source_path');
          const output = name.replace(/\.[^.]+$/, '.chd');
          item.referrer_changes = [...(item.referrer_changes ?? []), {
            referrer: 'romm_swap', target: 'RomM ROM 1234', entries: 1,
            edits: [{ old: name, new: output }],
            summary: `RomM: rename ROM 1234 to ${output}`,
          }];
        }
        return new Response(JSON.stringify(plan),
          { headers: { 'Content-Type': 'application/json' } });
      };
      await sleep(400);
      const vol = [...document.querySelectorAll('button.item')].find(b => b.textContent.trim() === 'GameCube');
      if (!vol) throw new Error('GameCube volume not found');
      vol.click();
      await sleep(800);
      const row = [...document.querySelectorAll('tbody tr')].find(tr => tr.textContent.includes('mario-kart.iso'));
      const pick = row?.querySelector('input[type="checkbox"]');
      if (!pick) throw new Error('mario-kart.iso not found');
      if (!pick.checked) pick.click();
      await sleep(400);
      const del = [...document.querySelectorAll('label')]
        .find(l => l.textContent.includes('Delete sources after successful verification'))
        ?.querySelector('input[type="checkbox"]');
      if (del && !del.checked) del.click();
      await sleep(300);
      [...document.querySelectorAll('button')].find(b => b.textContent.includes('Start conversion'))?.click();
      await sleep(1200);
    })()
