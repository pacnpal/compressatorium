# --- A check Rule's run (#305) --------------------------------------------
# After the Findings shots, so they keep showing only what a walk records. The
# fixture's "ROM Library/roms/gba" holds a ROM archive that reads back cleanly
# and one whose archive is damaged. The folder Library (a 409 means it is
# already registered) gets a GBA check Rule, sent alone so its other Rules stay
# as they are, and Run now checks both through romz's own Verify. The first
# pair of shots is the Findings view with the damaged one's Not Intact row; the
# second is the Check job in the Jobs panel's Completed tab.
- url: http://127.0.0.1:8099/?s=findings-not-intact-light#/workspace/chdman
  output: docs/screenshots/findings-not-intact-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: &js_findings_not_intact |
    (async () => {
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const volumes = await (await fetch('/api/volumes')).json();
      const volume = volumes.find(v => v.name === 'ROM Library');
      if (!volume) throw new Error('ROM Library volume not found');
      await fetch('/api/libraries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: volume.path + '/roms' }),
      });
      const libs = await (await fetch('/api/libraries')).json();
      const lib = libs.find(l => l.kind === 'folder');
      if (!lib) throw new Error('folder Library not registered');
      const id = encodeURIComponent(lib.id);
      await fetch(`/api/libraries/${id}/rules`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ check_rules: { gba: { enabled: true, check_budget_gb: 1 } } }),
      });
      await fetch(`/api/libraries/${id}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ platform_ids: ['gba'] }),
      });
      let found = false;
      for (let i = 0; i < 30 && !found; i++) {
        await new Promise(r => setTimeout(r, 300));
        const listed = await (await fetch('/api/findings')).json();
        found = listed.findings.some(f => f.kind === 'not_intact');
