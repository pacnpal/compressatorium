      location.hash = '#/dashboard';
      await new Promise(r => setTimeout(r, 300));
      location.hash = '#/findings';
      await new Promise(r => setTimeout(r, 1200));
      const rows = [...document.querySelectorAll('.findings-view .row:not(.header)')];
      if (!rows.some(r => r.textContent.includes('Not Intact'))) {
        throw new Error('Not Intact row not shown');
