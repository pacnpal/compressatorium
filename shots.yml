  javascript: |
    (async (theme) => {
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const sets = [
        ['Example Console - Discs', 'redump.org', 'Example Disc Game'],
        ['Example Handheld', 'No-Intro', 'Example Cartridge Game'],
        ['My homebrew set', '', 'Example Homebrew'],
      ];
      const have = (await (await fetch('/api/dat/ranking')).json()).dats.map(d => d.name);
      let added = false;
      for (const [index, [name, home, game]] of sets.entries()) {
        if (have.includes(name)) continue;
        const sha1 = String(index + 1).repeat(40);
        const xml = `<?xml version="1.0"?><datafile><header><name>${name}</name>` +
          `<description>${name}</description><homepage>${home}</homepage></header>` +
          `<game name="${game}"><rom name="${game}.bin" size="4" sha1="${sha1}"/></game></datafile>`;
        const form = new FormData();
        form.append('file', new Blob([xml], { type: 'text/xml' }), `${index}.dat`);
        const response = await fetch('/api/dat/import', { method: 'POST', body: form });
        if (!response.ok) throw new Error(`DAT import failed: ${response.status}`);
        added = true;
      }
      if (added) {
        // Remount the section so it loads the lists just imported.
        location.hash = '#/files';
        await new Promise(r => setTimeout(r, 400));
        location.hash = '#/settings/identification';
        await new Promise(r => setTimeout(r, 1200));
      }
      const order = document.querySelector('details.dat-ranking');
      if (!order) throw new Error('Name order not shown');
      order.open = true;
      await new Promise(r => setTimeout(r, 200));
      if (!order.querySelector('button[aria-label^="Move "]')) throw new Error('no move controls');
      order.scrollIntoView({ block: 'start' });
      await new Promise(r => setTimeout(r, 300));
    })('dark')

