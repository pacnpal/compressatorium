# --- Duplicate finder (#388) ----------------------------------------------
# After every other Findings shot, so they keep showing only their own rows.
# The fixture's ps2/ico.iso, ps2/okami.iso and gc/metroid-prime.iso are the same
# zero-filled placeholder, so a find-duplicates run of the folder Library (a 409
# means it is already registered) groups them as one disc; the GBA archives have
# no content key and show as not checked.
- url: http://127.0.0.1:8099/?s=findings-duplicates-light#/workspace/chdman
  output: docs/screenshots/findings-duplicates-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: &js_findings_duplicates |
    (async () => {
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const volumes = await (await fetch('/api/volumes')).json();
      const volume = volumes.find(v => v.name === 'ROM Library');
      if (!volume) throw new Error('ROM Library volume not found');
      await fetch('/api/libraries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: volume.path + '/roms' }),
      });
      const libs = await (await fetch('/api/libraries')).json();
      const lib = libs.find(l => l.kind === 'folder');
      if (!lib) throw new Error('folder Library not registered');
      await fetch(`/api/libraries/${encodeURIComponent(lib.id)}/find-duplicates`, {
        method: 'POST',
      });
      let found = false;
      for (let i = 0; i < 40 && !found; i++) {
        await new Promise(r => setTimeout(r, 300));
        const listed = await (await fetch('/api/findings')).json();
        found = listed.findings.some(f => f.kind === 'duplicate');
      }
      if (!found) throw new Error('no duplicate Finding recorded');
      location.hash = '#/dashboard';
      await new Promise(r => setTimeout(r, 300));
      location.hash = '#/findings';
      await new Promise(r => setTimeout(r, 1200));
      const row = [...document.querySelectorAll('.findings-view .row:not(.header)')]
        .find(r => r.textContent.includes('Duplicate'));
      if (!row) throw new Error('Duplicate row not shown');
      row.scrollIntoView({ block: 'center' });
    })()
