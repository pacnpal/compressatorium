# --- Workspace: Dolphin delete-source (Round-trip, container-only opt-out) --
# Selects every GameCube file and ticks delete-source so the convert panel
# shows the Round-trip wording and the "Container check only" opt-out (#298).
# The checkbox is found by its label text, the only stable hook it has.
- url: http://127.0.0.1:8099/?s=workspace-dolphin-delete-light#/workspace/dolphin
  output: docs/screenshots/workspace-dolphin-delete-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: &js_dolphin_delete |
    (async () => {
      const theme = new URLSearchParams(location.search).get('s').endsWith('dark')
        ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      await new Promise(r => setTimeout(r, 400));
      const vol = [...document.querySelectorAll('button.item')].find(b => b.textContent.trim() === 'GameCube');
      if (vol) vol.click();
      await new Promise(r => setTimeout(r, 500));
      const all = document.querySelector('thead input[type="checkbox"]');
      if (all && !all.checked) all.click();
      await new Promise(r => setTimeout(r, 400));
      const box = [...document.querySelectorAll('label.checkbox')]
        .find(l => l.textContent.includes('Delete sources'));
      const input = box && box.querySelector('input');
      if (input && !input.checked) input.click();
      await new Promise(r => setTimeout(r, 400));
    })()
