      });
      let found = false;
      for (let i = 0; i < 30 && !found; i++) {
        await new Promise(r => setTimeout(r, 300));
        const listed = await (await fetch('/api/findings')).json();
        found = listed.findings.some(f => f.kind === 'not_intact');
