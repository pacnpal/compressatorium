# --- Delete-on-verify confirmation (disc 1 of a two-disc set + its .m3u) ---
# Selects one disc on the PlayStation volume, ticks delete-on-verify and
# presses Start conversion, which only opens the confirmation (no job is
# queued). The modal lists the files to delete and the planned .m3u edit.
- url: http://127.0.0.1:8099/?s=delete-plan-light#/workspace/chdman
  output: docs/screenshots/delete-plan-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: |
    (async () => {
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      localStorage.setItem('theme-preference', 'light');
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: 'light' }));
      await sleep(400);
      const vol = [...document.querySelectorAll('button.item')].find(b => b.textContent.trim() === 'PlayStation');
      if (vol) vol.click();
      await sleep(800);
      const row = [...document.querySelectorAll('tbody tr')].find(tr => tr.textContent.includes('Final Quest (Disc 1).cue'));
      const pick = row?.querySelector('input[type="checkbox"]');
      if (pick && !pick.checked) pick.click();
      await sleep(400);
      const del = [...document.querySelectorAll('label')]
        .find(l => l.textContent.includes('Delete sources after successful verification'))
        ?.querySelector('input[type="checkbox"]');
      if (del && !del.checked) del.click();
      await sleep(300);
      [...document.querySelectorAll('button')].find(b => b.textContent.includes('Start conversion'))?.click();
      await sleep(1200);
    })()
