    (async () => {
      const shot = location.search.replace(/^\?s=/, '').replace(/-(light|dark)$/, '');
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      const waitFor = async (find, what) => {
        for (let i = 0; i < 60; i++) {
          const found = find();
          if (found) return found;
          await sleep(100);
        }
        throw new Error(what + ' not shown');
      };
      const real = window.fetch.bind(window);
      const live = async (path) => (await real(path)).json();
      const rules = await live('/api/romm/rules');
      const rom = (name, title, identified, match) => ({
        name, display_name: title, path: `/library/roms/ngc/${name}`, type: 'file',
        size: 1459978240, extension: '.iso', convertible_by: ['dolphin'], outputs: [],
        verifiable_by: [], romm_identified: identified, dat_match: match,
      });
      const known = rom('Pikmin (USA).iso', 'Pikmin', true, null);
      const homebrew = rom('swiss_r1788.iso', 'swiss_r1788', false, {
        path: '/library/roms/ngc/swiss_r1788.iso', matched: true, source: 'hasheous',
        dat_name: 'Redump', game_name: 'Swiss (World) (r1788)', platform: 'Nintendo GameCube',
        provider_ids: { hasheous_id: 4242 },
      });
      const mystery = rom('disc2.iso', 'disc2', false, null);
      const converter = shot === 'romm-converter'
        ? { enabled: true, error: null,
            platform_formats: { ngc: 'rvz', psx: 'chd', xbox360: 'zar' },
            library_targets: { ngc: ['iso', 'rvz'], psx: ['chd'], xbox360: ['zar'] },
            modes: { ngc: ['dolphin_rvz', 'nkit_to_rvz'], psx: ['createcd'],
              xbox360: ['zar_compress'] } }
        : undefined;
      const canned = {
        '/api/romm/status': { ...(await live('/api/romm/status')), configured: true,
          connected: true, version: '5.4.1', library_root: '/library',
          library_root_mounted: true, token_set: true, converter,
          swap: { keep_rom_id: shot === 'romm-more', missing: shot === 'romm-more' ? ['tasks.run'] : [] } },
        '/api/romm/settings': { ...(await live('/api/romm/settings')),
          url: 'http://romm:8080', library_root: '/library', token_set: true,
          repin_enabled: true, hasheous_write_ids: true, swap_keep_rom_id: shot === 'romm-more' },
        '/api/romm/platforms': [
          { id: 7, name: 'GameCube', slug: 'ngc', rom_count: 3, tool_ids: ['dolphin'],
            mode_ids: ['dolphin_rvz', 'dolphin_wia', 'dolphin_gcz'] },
          { id: 8, name: 'PlayStation', slug: 'psx', rom_count: 40, tool_ids: ['chdman'],
            mode_ids: ['createcd'] },
          { id: 11, name: 'Game Boy Advance', slug: 'gba', rom_count: 96, tool_ids: ['romz'],
            mode_ids: ['romz_7z', 'romz_zip'] },
        ],
        '/api/romm/rules': { ...rules, state: {}, rules: {
          7: { ...rules.defaults, enabled: true, mode: 'dolphin_rvz', verify_after: true,
            delete_on_verify: true },
          8: { ...rules.defaults, enabled: true, mode: 'createcd', verify_after: true } } },
        // The canned paths are outside this fixture's Volume, so the match
        // cache answers with the matches it holds. Nothing is matched for real.
        '/api/dat/matches/lookup': { results: { [homebrew.path]: homebrew.dat_match } },
        '/api/dat/match-batch/job': {
          status: 'idle', results: { [homebrew.path]: homebrew.dat_match },
        },
        '/api/libraries/romm/inboxes': { inboxes: [] },
      };
      const listing = (unidentified) => unidentified
        ? { entries: [mystery, homebrew], diagnostics: null,
            romm: { unidentified: 2, recognized: 1, recognized_unidentified: 1 } }
        : { entries: [known, mystery, homebrew], diagnostics: null,
            romm: { unidentified: 2, recognized: 2, recognized_unidentified: 1 } };
      window.fetch = (input, init) => {
        const url = new URL(typeof input === 'string' ? input : input.url, location.href);
        const body = url.pathname === '/api/romm/roms'
          ? listing(url.searchParams.get('unidentified') === 'true')
          : canned[url.pathname];
        if (body === undefined) return real(input, init);
        return Promise.resolve(new Response(JSON.stringify(body),
          { headers: { 'Content-Type': 'application/json' } }));
      };
      if (shot === 'romm-browse') {
        location.hash = '#/libraries/romm';
        const filter = await waitFor(() => document.querySelector('.unidentified .checkbox input'),
          'the Unidentified in RomM filter');
        filter.click();
        await waitFor(() => document.querySelector('.app-name'), 'the known-good-dump name');
      } else if (shot === 'romm-automation') {
        location.hash = '#/libraries/romm/automation';
        const more = await waitFor(() => document.querySelector(
          '[data-platform-id="7"] button[aria-label^="More settings"]'), 'the GameCube row');
        more.click();
        await waitFor(() => document.querySelector('.advanced'), 'the GameCube settings');
      } else if (shot === 'romm-converter') {
        location.hash = '#/libraries/romm/automation';
        await waitFor(() => document.querySelector('.banner'), "RomM's converter banner");
      } else if (shot === 'romm-more') {
        location.hash = '#/libraries/romm/connection';
        const more = await waitFor(() => document.querySelector('details.advanced'), 'More');
        more.open = true;
        more.scrollIntoView({ block: 'center' });
        await sleep(300);
      } else {
        throw new Error('no staging for ' + shot);
