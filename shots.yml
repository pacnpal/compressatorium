    (async () => {
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const real = window.fetch.bind(window);
      const live = async (path) => (await real(path)).json();
      const rules = await live('/api/romm/rules');
      const modes = ['dolphin_rvz', 'dolphin_wia', 'dolphin_gcz', 'dolphin_iso'];
      const canned = {
        '/api/romm/status': { ...(await live('/api/romm/status')), configured: true,
          connected: true, version: '4.0', library_root: '/library',
          library_root_mounted: true, token_set: true },
