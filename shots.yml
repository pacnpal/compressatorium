        '/api/romm/rules': { ...rules, state: {}, rules: { 7: { ...rules.defaults,
          enabled: true, mode: 'dolphin_rvz', delete_on_verify: true } } },
        '/api/romm/roms': { entries: [], diagnostics: null },
        '/api/rules/notices': { check_level: { show: true, switched: 1 } },
      };
      window.fetch = (input, init) => {
        const url = new URL(typeof input === 'string' ? input : input.url, location.href);
