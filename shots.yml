# --- Keep the ROM id when converting (#390) --------------------------------
# The Settings tab's switch card with the switch on and RomM saying the token
# lacks tasks.run, so the permission problem and the admin-token hint show. The
# status and settings are canned in the page, as in the shots above. Tall, so
# the card at the foot of the Settings tab fits. The theme comes from `?s=`.
- url: http://127.0.0.1:8099/?s=romm-swap-light#/romm
  output: docs/screenshots/romm-swap-light.png
  width: 1280
  height: 1900
  wait: 1800
  javascript: &js_romm_swap |
    (async () => {
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const real = window.fetch.bind(window);
      const live = async (path) => (await real(path)).json();
      const canned = {
        '/api/romm/status': { ...(await live('/api/romm/status')), configured: true,
          connected: true, version: '5.4.1', library_root: '/library',
          library_root_mounted: true, token_set: true,
          swap: { keep_rom_id: true, missing: ['tasks.run'],
            error: 'The token is missing tasks.run. The token has to be created by an admin user (or a user in a group that can write ROMs and run tasks) in RomM, under Administration, Client API Tokens.' } },
        '/api/romm/settings': { ...(await live('/api/romm/settings')),
          url: 'http://romm:8080', library_root: '/library', token_set: true,
          swap_keep_rom_id: true },
        '/api/romm/platforms': [],
        '/api/romm/roms': { entries: [], diagnostics: null },
      };
      window.fetch = (input, init) => {
        const url = new URL(typeof input === 'string' ? input : input.url, location.href);
        const body = canned[url.pathname];
        if (body === undefined) return real(input, init);
        return Promise.resolve(new Response(JSON.stringify(body),
          { headers: { 'Content-Type': 'application/json' } }));
      };
      location.hash = '#/dashboard';
      await new Promise(r => setTimeout(r, 300));
      location.hash = '#/romm';
      await new Promise(r => setTimeout(r, 800));
      const tab = [...document.querySelectorAll('.tab')].find(b => b.textContent.trim() === 'Settings');
      if (!tab) throw new Error('Settings tab not found');
      tab.click();
      await new Promise(r => setTimeout(r, 500));
      if (![...document.querySelectorAll('.card h2')].some(h => h.textContent.trim() === 'Keep the ROM id')) {
        throw new Error('swap card not shown');
      }
    })()
