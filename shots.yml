# fixture's "ROM Library/roms/gba" holds a ROM archive that reads back cleanly
# and one whose archive is damaged. The folder Library (a 409 means it is
# already registered) gets a GBA check Rule, sent alone so its other Rules stay
# as they are, and Run now checks both through romz's own Verify. The first
# pair of shots is the Findings view with the damaged one's Not Intact row; the
# second is the Check job in the Jobs panel's Completed tab.
