  wait: 1800
  javascript: *js_rule_editor

# --- Rules view on a folder Library (#303) --------------------------------
# The fixture's "ROM Library/roms" folder is registered as a Library through the
# API (a 409 on the second shot means it already is), given a PS2 Rule, and
# opened at #/rules/<library id>. The PS2 row is expanded so the editor shows.
- url: http://127.0.0.1:8099/?s=rules-folder-light#/workspace/chdman
  output: docs/screenshots/rules-folder-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: &js_rules_folder |
    (async () => {
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const volumes = await (await fetch('/api/volumes')).json();
      const volume = volumes.find(v => v.name === 'ROM Library');
      if (!volume) throw new Error('ROM Library volume not found');
      await fetch('/api/libraries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: volume.path + '/roms' }),
      });
      const libs = await (await fetch('/api/libraries')).json();
      const lib = libs.find(l => l.kind === 'folder');
      if (!lib) throw new Error('folder Library not registered');
      const id = encodeURIComponent(lib.id);
      await fetch(`/api/libraries/${id}/rules`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rules: { ps2: { mode: 'createdvd', enabled: true } } }),
      });
      location.hash = `#/rules/${id}`;
      await new Promise(r => setTimeout(r, 1200));
      // By Platform id, not label: the row shows the display name
      // ("PlayStation 2"), and the fixture's ps2 folder makes the id ps2.
      const row = document.querySelector('.row-toggle[data-platform-id="ps2"]');
      if (!row) throw new Error('ps2 Platform row not found');
      row.click();
      await new Promise(r => setTimeout(r, 500));
    })()
- url: http://127.0.0.1:8099/?s=rules-folder-dark#/workspace/chdman
  output: docs/screenshots/rules-folder-dark.png
  width: 1280
  height: 900
  wait: 1800
  javascript: *js_rules_folder

