# --- RomM (#541) -------------------------------------------------------------
# The fixture has no RomM, so the first pair is what a new user meets: the
# Connection tab, with RomM "found" and a test that fails. The others can
# RomM's answers in the page (fetch is wrapped,
# the rest still comes from the real backend), then open the RomM page. The
# shot's name says which surface; the theme comes from its suffix.
# --- Connecting RomM (#532) -------------------------------------------------
# First run: RomM "found" at its usual address (canned, since no RomM runs
# here), Use it, then a Save whose connection test fails on the token, so the
# field marked, the "not checked" row, Retry and the open More section show.
- url: http://127.0.0.1:8099/?s=romm-connect-light#/files
  output: docs/screenshots/romm-connect-light.png
  width: 1280
  height: 1500
  wait: 1800
  javascript: &js_romm_connect |
    (async () => {
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const real = window.fetch.bind(window);
      const canned = {
        '/api/romm/discover': { url: 'http://romm:8080', version: '5.4.1',
