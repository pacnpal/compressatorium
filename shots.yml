# === PR 2: Files ===
# --- Rename to DAT name (#425) ----------------------------------------------
# The fixture's "ROM Library/roms/snes/castle-quest.sfc" holds a known line of
# text; a small synthetic DAT (made-up name, that line's SHA1) is imported and
# the file matched, so it is Recognized. The file is ticked and "Rename to DAT
# name" pressed: the preview shows the old and new name and the DAT that gives
# it. The "done" shots also confirm, and show the job's result; each shot
# first puts the fixture's name back (through the single-file rename) when an
# earlier one renamed it, so each starts from the fixture as it was. Last in
# the file, so no earlier shot sees the sample DAT.
- url: http://127.0.0.1:8099/?s=dat-rename-preview-light#/files
  output: docs/screenshots/dat-rename-preview-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: &js_dat_rename |
    (async () => {
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      const theme = location.search.includes('-dark') ? 'dark' : 'light';
      const confirmIt = location.search.includes('-done-');
      localStorage.setItem('theme-preference', theme);
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: theme }));
      const volumes = await (await fetch('/api/volumes')).json();
      const volume = volumes.find(v => v.name === 'ROM Library');
      if (!volume) throw new Error('ROM Library volume not found');
      const folder = volume.path + '/roms/snes';
      const original = folder + '/castle-quest.sfc';
      const game = 'Castle Quest (World) (Homebrew)';
      const renamed = folder + '/' + game + '.sfc';
      const have = (await (await fetch('/api/dat/ranking')).json()).dats.map(d => d.name);
      if (!have.includes('Example Sample Set')) {
        const xml = '<?xml version="1.0"?><datafile><header><name>Example Sample Set</name>' +
          '<description>Example Sample Set</description><homepage>No-Intro</homepage></header>' +
          `<game name="${game}"><rom name="${game}.sfc" size="66" ` +
          'sha1="771aad691f89f444e76f80d7224aae92a400fffc"/></game></datafile>';
        const form = new FormData();
        form.append('file', new Blob([xml], { type: 'text/xml' }), 'sample.dat');
        await fetch('/api/dat/import', { method: 'POST', body: form });
      }
      const listing = await (await fetch('/api/files?path=' + encodeURIComponent(folder))).json();
      if ((listing.entries || []).some(e => e.path === renamed)) {
        await fetch('/api/files/rename?path=' + encodeURIComponent(renamed) +
          '&new_name=castle-quest.sfc', {
          method: 'POST', headers: { 'X-CHD-Action-Confirm': 'rename-file' },
        });
      }
      await fetch('/api/dat/match-batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paths: [original] }),
      });
      const vol = [...document.querySelectorAll('button.item')].find(b => b.textContent.trim() === 'ROM Library');
      if (vol) vol.click();
      await sleep(800);
      for (const name of ['roms', 'snes']) {
        const row = [...document.querySelectorAll('tbody tr')]
          .find(tr => tr.querySelector('.name-text')?.textContent.trim() === name);
        row?.querySelector('.name-button')?.click();
        await sleep(800);
      }
      const row = [...document.querySelectorAll('tbody tr')].find(tr => tr.textContent.includes('castle-quest.sfc'));
      const pick = row?.querySelector('input[type="checkbox"]');
      if (!pick) throw new Error('castle-quest.sfc not listed');
      if (!pick.checked) pick.click();
      await sleep(300);
      const open = [...document.querySelectorAll('button')].find(b => b.textContent.includes('Rename to DAT name'));
      if (!open) throw new Error('Rename to DAT name not offered');
      open.click();
      await sleep(1500);
      const dialog = document.querySelector('[role="dialog"]');
      if (!dialog || !dialog.textContent.includes(game)) throw new Error('rename preview not shown');
      if (!confirmIt) return;
      [...dialog.querySelectorAll('button')].find(b => b.textContent.includes('Rename 1 Image'))?.click();
      for (let i = 0; i < 30 && !dialog.textContent.includes('Renamed 1'); i++) await sleep(300);
      if (!dialog.textContent.includes('Renamed 1')) throw new Error('rename job did not finish');
      await sleep(400);
    })()
